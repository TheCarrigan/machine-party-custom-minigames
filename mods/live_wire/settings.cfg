; Live Wire - settings. Edit with any text editor, then restart the game.

[practice]
; Computer-controlled workers (0-3) that join Live Wire when no other machines are connected
; (playing alone, or couch play on one PC). They never join online matches.
bots=0

[arena]
; Which arena Live Wire is played in (keep the quotes). Only the host's choice counts online.
;   "rotate"  - a different arena each round (default)
;   "classic" - the original floor with two pillars
;   "pocket"  - a small floor, no pillars: nowhere to hide
;   "sweeper" - a rotating arm sweeps the floor
arena="rotate"
